<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d31"><title>My Wardrobe</title><link rel="stylesheet" href="css/style.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand">✦ My Wardrobe</div><nav id="desktop-nav"></nav><small>Personal wardrobe · Prototype</small></aside><div class="main-wrap"><header><div><span class="eyebrow">YOUR PERSONAL CLOSET</span><h1 id="page-title">Home</h1></div><button id="add-item" class="primary">＋ Add item</button></header><main id="app"></main></div></div><nav id="mobile-nav" class="mobile-nav"></nav><dialog id="item-dialog"><form id="item-form"><h2>Add clothing</h2><label>Item name<input name="name" required maxlength="80" placeholder="e.g. Navy polo shirt"></label><label>Category<select name="category"><option>T-shirt</option><option>Shirt</option><option>Jumper</option><option>Jacket</option><option>Trousers</option><option>Jeans</option><option>Shorts</option><option>Shoes</option><option>Accessories</option><option>Other</option></select></label><label>Colour<input name="colour" placeholder="e.g. Navy"></label><label>Clothing photograph (optional)<input id="photo-file" type="file" accept="image/*"></label><div id="photo-preview" class="photo-preview"></div><p class="notice">Without a photo, the app automatically shows an icon based on the clothing category. Photos in this prototype are stored only in this browser.</p><label>Storage section<select name="section" id="item-section"></select></label><div class="actions"><button type="button" class="secondary" id="cancel-item">Cancel</button><button class="primary">Save item</button></div></form></dialog><script src="js/app.js" defer></script></body></html>
