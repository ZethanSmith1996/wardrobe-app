
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>My Wardrobe</title>

  <style>
    :root {
      --navy: #101d31;
      --green: #284d4a;
      --cream: #eae7e0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      background: #f5f5f3;
      color: var(--navy);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 24px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 24px;
    }

    .welcome {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .welcome h2 {
      margin-top: 0;
    }

    .status {
      color: var(--green);
      font-weight: 600;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Wardrobe</h1>
  </header>

  <main>
    <section class="welcome">
      <h2>Welcome to your wardrobe</h2>

      <p>
        Your personal clothing organiser.
      </p>

      <p class="status">
        ✓ Application successfully loaded
      </p>

      <p>
        Your wardrobe dashboard is coming next.
      </p>
    </section>
  </main>

</body>
</html>
